name: metro_ui
description: A Flutter component library inspired by Microsoft's Windows 8 Modern UI design language.
version: 0.3.0
homepage: https://github.com/GT-610/metro_ui
repository: https://github.com/GT-610/metro_ui
issue_tracker: https://github.com/GT-610/metro_ui/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

topics:
  - metro
  - modern-ui
  - windows
  - desktop
  - widgets

screenshots:
  - description: Light theme controls, selection, progress, and input surfaces.
    path: screenshots/preview_controls_light.png
  - description: Dark theme navigation, dialogs, and the edge-docked flyout.
    path: screenshots/preview_navigation_dark.png
  - description: Light theme selectable rows, a sortable data grid, and tiles.
    path: screenshots/preview_lists_light.png
  - description: Light theme text entry, search, number boxes, and pickers.
    path: screenshots/preview_inputs_light.png

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Metro UI Sans
      fonts:
        - asset: assets/fonts/selawik-light.ttf
          weight: 300
        - asset: assets/fonts/selawik-regular.ttf
          weight: 400
        - asset: assets/fonts/selawik-semibold.ttf
          weight: 600
